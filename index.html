<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Izaz · Investor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f2f3f6;--card:#fff;--card-2:#f5f6f9;--ink:#0f1420;--ink-2:#465063;--muted:#7a8394;--line:#e9ecf1;--grid:#eceef2;--axis:#c7ccd6;--track:#eef0f4;--border:rgba(16,24,40,.05);
  --accent:#e2701c;--accent-soft:rgba(226,112,28,.12);--hdr-a:#f39340;--hdr-b:#c4560d;
  --good:#0f8a55;--good-soft:rgba(18,145,92,.12);--bad:#d23b3b;--bad-soft:rgba(210,59,59,.10);--warn:#9a5b06;--warn-soft:rgba(250,178,25,.20);
  --s1:#e2701c;--s2:#2a78d6;--s3:#1baf7a;
  --o1:#86b6ef;--o2:#5598e7;--o3:#2a78d6;--o4:#1c5cab;--o5:#104281;
  --tip-bg:#121826;--tip-ink:#fff;--nav-bg:rgba(255,255,255,.94);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);--r:20px
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c0f15;--card:#161a22;--card-2:#1c212b;--ink:#f1f3f7;--ink-2:#b4bccb;--muted:#7f8899;--line:#252b36;--grid:#232935;--axis:#3a4252;--track:#222834;--border:rgba(255,255,255,.05);
  --accent:#f0913f;--accent-soft:rgba(240,145,63,.16);--hdr-a:#a24c12;--hdr-b:#5a2808;
  --good:#3cc58a;--good-soft:rgba(60,197,138,.14);--bad:#f07272;--bad-soft:rgba(240,114,114,.14);--warn:#e3b053;--warn-soft:rgba(227,176,83,.16);
  --s1:#df6f22;--s2:#3987e5;--s3:#199e70;
  --o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
  --tip-bg:#eef1f6;--tip-ink:#0f1420;--nav-bg:rgba(22,26,34,.94);--shadow:none
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c0f15;--card:#161a22;--card-2:#1c212b;--ink:#f1f3f7;--ink-2:#b4bccb;--muted:#7f8899;--line:#252b36;--grid:#232935;--axis:#3a4252;--track:#222834;--border:rgba(255,255,255,.05);
    --accent:#f0913f;--accent-soft:rgba(240,145,63,.16);--hdr-a:#a24c12;--hdr-b:#5a2808;
    --good:#3cc58a;--good-soft:rgba(60,197,138,.14);--bad:#f07272;--bad-soft:rgba(240,114,114,.14);--warn:#e3b053;--warn-soft:rgba(227,176,83,.16);
    --s1:#df6f22;--s2:#3987e5;--s3:#199e70;
    --o1:#184f95;--o2:#256abf;--o3:#3987e5;--o4:#6da7ec;--o5:#9ec5f4;
    --tip-bg:#eef1f6;--tip-ink:#0f1420;--nav-bg:rgba(22,26,34,.94);--shadow:none
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;padding-bottom:28px}
body.has-nav{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.num,.tbl,.tick{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}

/* sarlavha */
.hdr{background:radial-gradient(130% 150% at 100% 0%,var(--hdr-a) 0%,var(--hdr-b) 75%);color:#fff;padding:12px 16px 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hdr::before{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hdr::after{content:"";position:absolute;left:-50px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.hdr-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;letter-spacing:-.5px}
body.sub .logo{display:none}
.t1{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:12px;cursor:pointer;flex:none;display:grid;place-items:center}
.back{background:rgba(255,255,255,.18);border:0;color:#fff;height:38px;padding:0 12px 0 8px;border-radius:12px;cursor:pointer;flex:none;font-weight:600;display:flex;align-items:center;gap:2px}
.hero{position:relative;z-index:1;margin-top:18px}
.hero:empty{display:none}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-1px;line-height:1.1;margin-top:4px;white-space:nowrap}
.hero .big.sm{font-size:26px;letter-spacing:-.4px}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hchips span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}

/* pastki menyu */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;background:var(--nav-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.nav .ib{width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.nav button.on{color:var(--ink)}
.nav button.on .ib{background:var(--accent-soft);color:var(--accent)}

main{padding:14px 16px 0;max-width:640px;margin:0 auto}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 4px 10px}
.sec h2{font-size:17px;font-weight:700;margin:0;letter-spacing:-.2px}
.sec .aside{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border)}
main>.card+.card,main>.card+.list,main>.list+.card{margin-top:12px}
.pos{color:var(--good)}.neg{color:var(--bad)}

/* ko'rsatkich plitkalari */
.tile{display:flex;flex-direction:column;min-width:0;padding:14px}
.tile.wide{grid-column:1/-1}
.tile-h{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.tile-h span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tico{width:28px;height:28px;border-radius:9px;background:var(--card-2);color:var(--ink-2);display:grid;place-items:center;flex:none}
.tile .v{font-size:20px;font-weight:700;margin-top:10px;white-space:nowrap;letter-spacing:-.3px}
.tile .n{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .spark{display:block;width:100%;height:auto;margin-top:10px}
.link{cursor:pointer}
.tile.link .tile-h::after{content:"›";margin-left:auto;font-size:18px;line-height:1;color:var(--muted)}

/* grafik kartochkasi */
.cc-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.cc-h h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.cc-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.tbtn{border:1px solid var(--line);background:var(--card);color:var(--muted);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart text{font-family:inherit}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--axis);stroke-width:1}
.chart .tick,.chart .xl{fill:var(--muted);font-size:10.5px}
.chart .vl{fill:var(--ink-2);font-size:11px;font-weight:700}
.chart .hit{fill:transparent;cursor:pointer;outline:none}
.chart .guide{stroke:var(--axis);stroke-width:1;opacity:0}
.chart .guide.hl{opacity:1}
.mk{transition:opacity .15s,filter .15s;outline:none}
.mk.hl{filter:brightness(1.12)}
.dim .mk:not(.hl){opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .v{color:var(--ink);font-weight:700}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.sw.ln{height:3px;width:14px;border-radius:2px}
.empty{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}

/* donut */
.dn{display:flex;align-items:center;gap:16px}
.dn svg{flex:none;width:128px;height:128px}
.dn .dc-v{fill:var(--ink);font-size:17px;font-weight:700}
.dn .dc-l{fill:var(--muted);font-size:10.5px}
.lg{flex:1;min-width:0}
.lg-r{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:1px 8px;padding:7px 0;border-top:1px solid var(--line)}
.lg-r:first-child{border-top:0;padding-top:0}
.lg-r:last-child{padding-bottom:0}
.lg-r .k{font-size:12.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg-r .v{grid-column:2;font-size:14px;font-weight:700;white-space:nowrap}
.lg-r .v small{font-size:11.5px;color:var(--muted);font-weight:500;margin-left:6px}
.lg-r.link .k::after{content:" ›";color:var(--muted)}
@media (max-width:350px){.dn{flex-direction:column;align-items:stretch}.dn svg{margin:0 auto}}

/* yig'ma chiziq */
.stk{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--track)}
.stk i{display:block;height:100%;min-width:4px;cursor:pointer}
.rows{margin-top:10px}
.pr{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.pr:first-child{border-top:0}
.pr .k{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .c{font-weight:700;text-align:right;white-space:nowrap}
.pr .s{color:var(--muted);font-size:12.5px;text-align:right;white-space:nowrap;min-width:72px}
.pr.link .k::after{content:" ›";color:var(--muted)}
.pr .ok{width:16px;height:16px;border-radius:50%;background:var(--good-soft);color:var(--good);display:grid;place-items:center}

/* gorizontal ustunlar */
.hb-r{padding:9px 0;border-top:1px solid var(--line)}
.hb-r:first-child{border-top:0;padding-top:2px}
.hb-t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px}
.hb-t .k{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t .v{font-weight:700;white-space:nowrap}
.hb-b{height:8px;margin-top:6px}
.hb-b i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:3px}
.hb-s{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-r.link .hb-t .k::after{content:" ›";color:var(--muted)}

/* metr */
.meter{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mrow .big2{font-size:24px;font-weight:750;letter-spacing:-.5px}
.mrow .s{font-size:12.5px;color:var(--muted)}

/* ro'yxatlar */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.row:first-child{border-top:0}
.row.static{cursor:default}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{text-align:right;flex:none}
.row .end .v{font-weight:700}
.row .end .s{font-size:12px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:13px;background:var(--card-2);color:var(--ink-2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.av.in{background:var(--accent-soft);color:var(--accent)}
.av.out{background:var(--good-soft);color:var(--good)}
.mini{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;margin-top:7px;background:var(--track)}
.mini i{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 7px;border-radius:999px;background:var(--card-2);color:var(--ink-2);white-space:nowrap;vertical-align:1px}
.pill .dot{width:7px;height:7px;border-radius:50%;flex:none}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.unk{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;gap:2px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:7px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;padding:11px 0;color:var(--ink);min-width:0}
.search:focus-within{border-color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl th:last-child,.tbl td:last-child{padding-right:0}
.tbl td{text-align:right;padding:8px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tblw{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.kv.link .v::after{content:" ›";color:var(--muted);font-weight:400}
.steps{display:flex;gap:4px;margin:4px 0 6px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--track)}
.steps-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--track);cursor:zoom-in}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:80}
.viewer img{max-width:100%;max-height:100%}
.center{text-align:center;padding:40px 16px;color:var(--ink-2)}
.center h2{color:var(--ink);margin:10px 0 6px;font-size:20px}
.idbox{font:700 22px/1.2 ui-monospace,Menlo,monospace;background:var(--card);border-radius:14px;padding:14px;margin:14px auto 10px;max-width:260px;box-shadow:var(--shadow);user-select:all}
.btn{border:0;background:var(--accent);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;cursor:pointer}
.spin{width:28px;height:28px;border:3px solid var(--track);border-top-color:var(--accent);border-radius:50%;margin:0 auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tip-bg);color:var(--tip-ink);padding:9px 14px;border-radius:12px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}
.warn{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:11px 12px;font-size:13px;margin-top:10px}
.banner{display:flex;align-items:center;gap:12px}
.banner .main{flex:1;min-width:0}
.banner .l{font-size:12.5px;color:var(--muted);font-weight:600}
.banner .v{font-size:22px;font-weight:750;letter-spacing:-.4px;margin-top:2px}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:24px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.row.open{background:var(--card-2)}
.entries{background:var(--card-2);padding:2px 14px 10px;border-top:1px solid var(--line)}
.ent{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.ent:first-child{border-top:0}
.ent .m{color:var(--muted);font-size:12px;margin-top:1px}
.ent .a{font-weight:600;white-space:nowrap;text-align:right}
.bar4{height:4px;margin-top:7px;border-radius:0 2px 2px 0}
.tip{position:fixed;z-index:70;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);border-radius:12px;padding:8px 11px;font-size:12.5px;box-shadow:0 10px 28px rgba(0,0,0,.22);max-width:250px;opacity:0;transition:opacity .12s}
.tip.show{opacity:1}
.tip .tt{opacity:.7;font-size:11.5px;margin-bottom:4px}
.tip .tr{display:flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.5}
.tip .tr b{font-weight:700}
.tip .tr span:last-child{opacity:.75}
.tip .key{width:12px;height:3px;border-radius:2px;flex:none}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-row">
    <button id="back" class="back" hidden><svg class="ic" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Orqaga</button>
    <div class="brand"><div class="logo">IZ</div><div style="min-width:0"><div class="t1" id="title">Izaz</div><div class="t2" id="sub">Investorlar kabineti</div></div></div>
    <button id="refresh" class="iconbtn" title="Yangilash" aria-label="Yangilash" hidden><svg class="ic" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
  </div>
  <div class="hero" id="hero"></div>
</header>
<main id="main"><div class="center"><div class="spin"></div><p>Yuklanmoqda…</p></div></main>
<nav id="nav" class="nav" hidden></nav>
<div id="tip" class="tip" role="tooltip"></div>
<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';
  /* Tashqi hostingda ishlatilsa: Apps Script /exec havolasi. Apps Script ichida bo'sh qoladi. */
  var API_URL = 'https://script.google.com/macros/s/AKfycbzhdqq2g8I9qoghrtpJqSQtiTXxr3fDkg9wm0Gh8qlTjnnvrTGoRH0ap-2KR5neTxaWQQ/exec';

  var tg = window.Telegram && window.Telegram.WebApp;

    if (v.my) v.my.forEach(function (x) {
      var named = v.my.length > 1 || d.role === 'admin';
      h += kv(named ? x.n + ': ulush (bron)' : 'Ulushingiz (bron)', money(x.b)) + kv(named ? x.n + ': foyda' : 'Foydangiz', x.f ? money(x.f) : '—', x.f > 0 ? 'pos' : '');
    });
    if (d.role !== 'admin') h += kv('Mashina tannarxi', money(v.t), '', 'data-cost="' + esc(v.v) + '"') + kv('Sotuv narxi', v.p ? money(v.p) : '—') + kv('Mashina foydasi', v.f ? money(v.f) : '—', v.f > 0 ? 'pos' : (v.f < 0 ? 'neg' : ''));
    if (d.role === 'admin') {
      h += kv('Bron summasi', money(v.b)) + kv('Tannarx', money(v.t), '', 'data-cost="' + esc(v.v) + '"') + kv('Sotuv', v.p ? money(v.p) : '—') + kv('Foyda', v.f ? money(v.f) : '—', v.f > 0 ? 'pos' : (v.f < 0 ? 'neg' : ''));
      if (v.f) h += kv('Investorlar ulushi', money(v.fi)) + kv('Egasi ulushi', money(v.fo)) + kv('Izaz ulushi', money(v.fz));
    }
    h += '</div>';
    if (d.role === 'admin' && !v.my) {
      h += sec('Investorlar') + '<div class="list">' + v.i.map(function (n, k) {
        if (!n) return '';
        return '<div class="row" data-inv="' + esc(n) + '"><div class="av">' + esc(initials(n)) + '</div><div class="main"><div class="ttl">' + esc(n) + '</div><div class="meta">Bron ' + money(v.bk[k]) + '</div></div><div class="end"><div class="v">' + (v.fk[k] ? money(v.fk[k]) : '—') + '</div><div class="s">foyda</div></div></div>';
      }).join('') + '</div>';
    }
    h += sec('Rasmlar') + '<div id="ph" class="card"><div class="spin"></div></div>';
    $('#main').innerHTML = h + foot();
    loadPhotos(v.v);
  }
  /* --- xarajatlar --- */
  function findVin(vin) { return state.data.vins.filter(function (x) { return x.v === vin; })[0]; }
  function costView(vin) {
    var d = state.data, v = findVin(vin);
    if (!v) { pop(); return; }
    header('Xarajatlar', (v.m || '') + ' · ' + v.v.slice(-6));
    var items = (d.costHead || []).map(function (n, i) { return { n: n, i: i, v: (v.c || [])[i] || 0 }; });
    var used = items.filter(function (x) { return x.v; });
    var tot = sum(used, function (x) { return x.v; }) || 1;
    var groups = [0, 0, 0]; used.forEach(function (x) { groups[costGroup(x.n)] += x.v; });
    hero('Tannarx', money(v.t), v.p ? ['sotuv ' + esc(cmoney(v.p)), 'foyda ' + esc(cmoney(v.f))] : [esc(v.s || '')]);
    var ent = state.costs[vin];
    var h = '<div class="card">' + splitBar(CG.map(function (l, i) { return { l: l, v: groups[i], c: 'var(--s' + (i + 1) + ')' }; })) + '</div>';
    h += sec(used.length + ' ta modda', 'bosing: yozuvlar') + '<div class="list">' + used.map(function (x) {
      var open = state.open === x.i;
      var body = '';
      if (open) {
        if (!ent) body = '<div class="entries"><div class="spin" style="margin:10px auto"></div></div>';
        else if (ent.error) body = '<div class="entries"><div class="ent"><span class="m">Yuklab bo\'lmadi: ' + esc(ent.error) + '</span></div></div>';
        else {
          var list = ent[x.n] || [];
          body = '<div class="entries">' + (list.length ? list.map(function (e) {
            return '<div class="ent"><div><div>' + esc(e.t || '—') + '</div><div class="m">' + esc(e.d || '') + '</div></div><div class="a">' + money(e.a) + (e.o ? '<div class="m">' + esc(e.o) + '</div>' : '') + '</div></div>';
          }).join('') : '<div class="ent"><span class="m">Batafsil yozuv topilmadi, summa Hisobot varag\'idan.</span></div>') + '</div>';
        }
      }
      return '<div class="row' + (open ? ' open' : '') + '" data-item="' + x.i + '"><div class="main"><div class="ttl">' + esc(costLabel(x.n)) + '</div><div class="bar4" style="width:' + Math.max(1, x.v / tot * 100) + '%;background:var(--s' + (costGroup(x.n) + 1) + ')"></div></div>' +
        '<div class="end"><div class="v">' + money(x.v) + '</div><div class="s">' + pct1(x.v / tot) + '</div></div></div>' + body;
    }).join('') + '</div>';
    var zero = items.length - used.length;
    if (zero) h += '<div class="foot" style="margin-top:10px">Yana ' + zero + ' ta modda bo\'yicha xarajat yo\'q</div>';
    $('#main').innerHTML = h + foot();
    if (!ent) loadCosts(vin);
  }
  function loadCosts(vin) {
    if (state.costs[vin] === 0) return;
    state.costs[vin] = 0;
    call('getCosts', [state.init, vin], function (r) {
      state.costs[vin] = r && r.ok ? (r.entries || {}) : { error: (r && (r.message || r.code)) || 'xato' };
      var top = state.stack[state.stack.length - 1];
      if (top && top.t === 'cost' && top.v === vin) render();
    }, function (err) {
      state.costs[vin] = { error: (err && err.message) || String(err) };
      var top = state.stack[state.stack.length - 1];
      if (top && top.t === 'cost' && top.v === vin) render();
    });
  }
  function aggView(sold) {
    var d = state.data;
    var cars = d.vins.filter(function (v) { return sold ? v.s === 'Sotilgan' : v.s !== 'Sotilgan'; });
    var items = (d.costHead || []).map(function (n, i) {
      return { n: n, i: i, v: sum(cars, function (c) { return (c.c || [])[i] || 0; }) };
    }).filter(function (x) { return x.v; }).sort(function (a, b) { return b.v - a.v; });
    var tot = sum(items, function (x) { return x.v; }) || 1;
    var groups = [0, 0, 0]; items.forEach(function (x) { groups[costGroup(x.n)] += x.v; });
    header(sold ? 'Sotilgan mashinalar' : 'Yo\'ldagi va skladdagi', 'Tannarx moddalari');
    hero('Jami tannarx', money(tot), [cars.length + ' ta mashina', 'o\'rtacha ' + esc(cmoney(tot / Math.max(cars.length, 1)))]);
    var h = '<div class="card">' + splitBar(CG.map(function (l, i) { return { l: l, v: groups[i], c: 'var(--s' + (i + 1) + ')' }; })) + '</div>';
    h += sec(items.length + ' ta modda', 'bosing: mashinalar') + '<div class="list">' + items.map(function (x) {
      var open = state.open === x.i;
      var body = '';
      if (open) {
        var list = cars.map(function (c) { return { c: c, v: (c.c || [])[x.i] || 0 }; }).filter(function (y) { return y.v; }).sort(function (a, b) { return b.v - a.v; });
        body = '<div class="entries">' + list.map(function (y) {
          return '<div class="ent" data-vin="' + esc(y.c.v) + '" style="cursor:pointer"><div><div>' + esc(y.c.m || y.c.v) + '</div><div class="m"><span class="mono">' + esc(y.c.v.slice(-6)) + '</span> · ' + esc(y.c.i.filter(String).join(', ')) + '</div></div><div class="a">' + money(y.v) + '</div></div>';
        }).join('') + '</div>';
      }
      return '<div class="row' + (open ? ' open' : '') + '" data-item="' + x.i + '"><div class="main"><div class="ttl">' + esc(costLabel(x.n)) + '</div><div class="bar4" style="width:' + Math.max(1, x.v / tot * 100) + '%;background:var(--s' + (costGroup(x.n) + 1) + ')"></div></div>' +
        '<div class="end"><div class="v">' + money(x.v) + '</div><div class="s">' + pct1(x.v / tot) + '</div></div></div>' + body;
    }).join('') + '</div>';
    $('#main').innerHTML = h + foot();
  }

  function loadPhotos(vin) {
    var count = (state.data.photoCounts || {})[vin] || 0;
    var box = $('#ph');
    if (!count) { box.innerHTML = '<div style="color:var(--muted);font-size:13.5px">Bu mashina rasmlari hali yuklanmagan.</div>'; return; }
    call('getPhotos', [state.init, vin], function (r) {
      var b = $('#ph'); if (!b) return;
      if (!r || r.ok === false || !r.photos || !r.photos.length) { b.innerHTML = '<div style="color:var(--muted)">Rasmlarni yuklab bo\'lmadi.</div>'; return; }
      b.innerHTML = '<div class="photos">' + r.photos.map(function (src) { return '<img src="' + src + '" alt="" data-zoom>'; }).join('') + '</div>' +
        (r.total > r.photos.length ? '<div style="color:var(--muted);font-size:12px;margin-top:8px">Oxirgi ' + r.photos.length + ' ta rasm ko\'rsatildi (jami ' + r.total + ')</div>' : '');
    }, function () { var b = $('#ph'); if (b) b.innerHTML = '<div style="color:var(--muted)">Rasmlarni yuklab bo\'lmadi.</div>'; });
  }

  /* ===== hodisalar ===== */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab],[data-itab],[data-inv],[data-vin],[data-filter],[data-sort],[data-status],[data-copy],[data-retry],[data-zoom],[data-cost],[data-item],[data-agg],[data-tbl],[data-period],[data-metric],.viewer,#back,#refresh');
    if (!t) return;
    if (t.classList.contains('viewer')) { t.remove(); return; }
    if (t.id === 'back') { pop(); return; }
    if (t.id === 'refresh') { load(true); return; }
    if (t.hasAttribute('data-retry')) { $('#main').innerHTML = '<div class="center"><div class="spin"></div></div>'; load(false); return; }
    if (t.hasAttribute('data-copy')) {
      var val = t.getAttribute('data-copy');
      try { navigator.clipboard.writeText(val).then(function () { toast('Nusxalandi'); }, function () { toast(val, 3000); }); } catch (er) { toast(val, 3000); }
      return;
    }
    if (t.hasAttribute('data-zoom')) { var w = document.createElement('div'); w.className = 'viewer'; w.innerHTML = '<img src="' + t.getAttribute('src') + '">'; document.body.appendChild(w); return; }
    if (t.hasAttribute('data-tbl')) { var id = t.getAttribute('data-tbl'); state.tbl[id] = !state.tbl[id]; render(); return; }
    if (t.hasAttribute('data-period')) { state.period = t.getAttribute('data-period'); render(); return; }
    if (t.hasAttribute('data-metric')) { state.metric = t.getAttribute('data-metric'); render(); return; }
    if (t.hasAttribute('data-cost')) { push({ t: 'cost', v: t.getAttribute('data-cost') }); return; }
    if (t.hasAttribute('data-agg')) { push({ t: 'agg', sold: t.getAttribute('data-agg') === '1' }); return; }
    if (t.hasAttribute('data-item')) { var it = Number(t.getAttribute('data-item')); state.open = state.open === it ? -1 : it; render(); return; }
    if (t.hasAttribute('data-tab')) { state.tab = t.getAttribute('data-tab'); render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-itab')) { state.itab = t.getAttribute('data-itab'); render(); if (!state.stack.length) window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-sort')) { state.sort = t.getAttribute('data-sort'); render(); return; }
    if (t.hasAttribute('data-filter')) { state.filter = t.getAttribute('data-filter'); render(); return; }
    if (t.hasAttribute('data-status')) { state.tab = 'mashinalar'; state.filter = t.getAttribute('data-status'); state.stack = []; render(); window.scrollTo(0, 0); return; }
    if (t.hasAttribute('data-inv') && state.data.role === 'admin') { state.itab = 'kabinet'; push({ t: 'inv', names: [t.getAttribute('data-inv')] }); return; }
    if (t.hasAttribute('data-vin')) { push({ t: 'vin', v: t.getAttribute('data-vin') }); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q' || e.target.id === 'iq') {
      var id = e.target.id, pos = e.target.selectionStart;
      state[id] = e.target.value;
      render();
      var el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (er) {} }
    }
  });
  /* tooltip: sichqoncha, barmoq va klaviatura */
  document.addEventListener('pointermove', function (e) {
    if (e.pointerType !== 'mouse') return;
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (t) showTip(t, e.clientX, e.clientY); else if (tipOn) hideTip();
  });
  var ptrAt = 0;
  document.addEventListener('pointerdown', function (e) {
    ptrAt = Date.now();
    var t = e.target.closest && e.target.closest('[data-tip]');
    if (t) showTip(t, e.clientX, e.clientY); else hideTip();
  });
  document.addEventListener('focusin', function (e) { if (Date.now() - ptrAt < 600) return; var t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
  document.addEventListener('focusout', function () { if (Date.now() - ptrAt < 600) return; hideTip(); });
  window.addEventListener('scroll', function () { if (tipOn) hideTip(); }, { passive: true });

  getInit(function (init) {
    state.init = init || '';
    if (!state.init) { denied({ code: 'no_auth' }); return; }
    load(false);
  });
})();
</script>
</body>
</html>
